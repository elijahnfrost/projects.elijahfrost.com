<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Projects — Elijah Frost</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="site-main">
      <div class="shell">
        <div class="shell-inner page-stack">
          <header class="page-header site-heading" aria-labelledby="page-title">
            <div class="page-header-stack">
              <h1 id="page-title" class="page-title">Projects</h1>
              <div class="rail-meta">
                <p class="meta-label">Last updated</p>
                <p id="updated" class="meta-time" aria-live="polite"></p>
              </div>
              <div id="status" class="status status--header" aria-live="polite"></div>
            </div>
          </header>

          <div class="tree-shell">
            <ul id="root" class="tree"></ul>
          </div>
        </div>
      </div>
    </main>
    <script src="/script.js" defer></script>
    <script src="/cursor.js" defer></script>
  </body>
</html>
